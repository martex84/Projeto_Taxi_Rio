services:
  # Serviço do Backend
  backend:
    build: ./Backend
    ports:
      - 3001:3001
    depends_on:
      - mysql
    restart: always

  mysql:
    image: mysql
    ports:
      - 3307:3306
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_ALLOW_EMPTY_PASSWORD=password
      - MYSQL_RANDOM_ROOT_PASSWORD=password
    restart: always
